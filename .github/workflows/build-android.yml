name: Build Android App

# Si attiva a mano dalla scheda "Actions" di GitHub.
on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installa dipendenze
        run: npm install --legacy-peer-deps

      # Questo progetto non ha una cartella android/ committata (finora la
      # generava EAS Build al volo) - la generiamo qui dal contenuto di
      # app.json, così restano sempre sincronizzati versionCode/bundle/plugin.
      - name: Genera il progetto nativo Android (expo prebuild)
        env:
          EXPO_PUBLIC_BACKEND_URL: ${{ vars.EXPO_PUBLIC_BACKEND_URL }}
        run: npx expo prebuild --platform android --clean

      # La firma dell'app (keystore) va caricata come Secret di repository.
      # IMPORTANTE: dato che l'app è già pubblicata, deve essere lo STESSO
      # keystore usato finora dalle build EAS - non uno nuovo - altrimenti
      # Google Play rifiuta l'aggiornamento. Recuperalo con:
      #   eas credentials  (poi scegli Android > Download keystore)
      - name: Decodifica keystore di firma
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/matchsport24-release.keystore
            echo "Keystore decodificato correttamente."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 non impostato - il bundle risultante NON sarà firmato."
          fi

      - name: Configura la firma in Gradle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat >> android/gradle.properties << EOF
          MATCHSPORT24_UPLOAD_STORE_FILE=matchsport24-release.keystore
          MATCHSPORT24_UPLOAD_KEY_ALIAS=$ANDROID_KEY_ALIAS
          MATCHSPORT24_UPLOAD_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD
          MATCHSPORT24_UPLOAD_KEY_PASSWORD=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build Android App Bundle (.aab)
        working-directory: frontend/android
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew bundleRelease

      - name: Carica il file .aab come risultato
        uses: actions/upload-artifact@v4
        with:
          name: matchsport24-android-release
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
